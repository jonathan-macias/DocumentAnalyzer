name: CI

# Lint + offline tests on every PR to main or PROD and on every push to main.
# deploy.yml reuses it (workflow_call) before building the production image.
# Integration tests (real OpenAI calls) are not run here: `pytest` deselects them by default.
on:
  pull_request:
    branches: [main, PROD]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest, offline)
        run: uv run pytest -q

  docker-build:
    name: Docker build (validation)
    # PRs only: checks the Dockerfile still builds before it reaches PROD.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=pr
          cache-to: type=gha,scope=pr,mode=max
