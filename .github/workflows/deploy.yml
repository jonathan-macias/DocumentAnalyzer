name: Deploy PROD

# Every push to the PROD branch (normally the merge of a main → PROD PR):
#   1. test     (reuses ci.yml on GitHub)
#   2. build    (native ARM64 image on ubuntu-24.04-arm → GHCR)
#   3. deploy   (self-hosted runner on the Orange Pi → deploy/deploy.sh)
#
# Secrets (OPENAI_API_KEY, API_KEY) are NOT in GitHub: they live in
# /opt/document-analyzer/.env on the Pi.
#
# Manual rollback: Actions → Deploy PROD → Run workflow (branch PROD) with the image_tag
# of a previous version (e.g. sha-abc1234). Tests and build are skipped.
on:
  push:
    branches: [PROD]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Already published tag to deploy (e.g. sha-abc1234). Empty = build and deploy the current PROD commit"
        required: false
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/document-analyzer

jobs:
  test:
    if: github.ref == 'refs/heads/PROD' && !inputs.image_tag
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ARM64 → GHCR
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.API_IMAGE }}:prod
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  deploy:
    name: Deploy on Orange Pi
    needs: build
    # Runs after a successful build, or directly for a rollback (build skipped).
    # Never outside the PROD branch.
    if: >-
      always() && github.ref == 'refs/heads/PROD' &&
      (needs.build.result == 'success' || (inputs.image_tag && needs.build.result == 'skipped'))
    runs-on: [self-hosted, linux, ARM64, docanalyzer-prod]
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        env:
          IMAGE_TAG: ${{ inputs.image_tag || needs.build.outputs.tag }}
        run: bash deploy/deploy.sh "$IMAGE_TAG"
